[project]
name = "new-tech-takehome"
version = "0.1.0"
description = "Take-home exercise for planning decision-support tooling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0.0",
    "python-dotenv>=1.1.1",
    "fastembed>=0.4.2",
    "jinja2>=3.1.6",
    "kreuzberg>=4.2.2",
    "loguru>=0.7.3",
    "mypy>=2.1.0",
    "openai>=1.50.0",
    "openai-agents>=0.13.3",
    "pandas>=3.0.3",
    "pymupdf>=1.24.0",
    "pydantic>=2.0.0",
    "reportlab>=4.4.9",
    "requests>=2.32.0",
    "ruff>=0.14.14",
    "typer>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src/" = ""

[project.scripts]
parser = "parser.main:app"
planning = "main:app"
assignment-setup = "assignment_setup_cli:main"
assignment-status = "assignment_setup_cli:status"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.ruff]
fix = true
unsafe-fixes = false

[tool.ruff.lint]
select = [
    "F",  # default Ruff rules
    "E",  # pycodestyle Errors
    "W",  # pycodestyle Warnings
    "I",  # import sorting
    "UP", # modern syntax updates
    "B",  # flake8 common pitfalls & best practices
    "Q",  # flake8 consistent quotes
    "N",  # naming conventions,
]

ignore = [
    "B008",
    "D413",
    "E501",
    "W293",
    "W291",
    "PLR2004",
    "D101",
    "D400",

]

fixable = ["ALL"]

extend-select = [
    "PLR2004",
    "D101",
    "D102",
    "D103",
    "D201",
    "D202",
    "D215",
    "T201",
]

[tool.mypy]
disallow_any_generics = true
disallow_untyped_defs = true
disallow_untyped_globals = true
ignore_missing_imports = true
show_error_codes = true
strict = false
warn_return_any = true
plugins = ['pydantic.mypy']
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
